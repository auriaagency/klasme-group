<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Klasme Group — Em Breve</title>
  <meta name="description" content="Klasme Group. Grandes marcas de cosméticos asiáticas chegando em breve.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">

  <style>
    :root {
      --gold: #c9a15a;
      --gold-soft: #e6cf9e;
      --black: #050505;
      --white: #f7f4ee;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
    }

    body {
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: var(--black);
      color: var(--white);
      font-family: 'Jost', sans-serif;
      overflow: hidden;
      padding: 24px;
    }

    /* Ambient luxury glow background */
    .glow {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background:
        radial-gradient(ellipse 60% 45% at 50% 15%, rgba(201, 161, 90, 0.16), transparent 60%),
        radial-gradient(ellipse 50% 40% at 20% 85%, rgba(201, 161, 90, 0.08), transparent 65%),
        radial-gradient(ellipse 50% 40% at 85% 80%, rgba(201, 161, 90, 0.08), transparent 65%);
      animation: drift 14s ease-in-out infinite alternate;
    }

    @keyframes drift {
      0%   { transform: scale(1) translateY(0); opacity: 0.85; }
      100% { transform: scale(1.08) translateY(-10px); opacity: 1; }
    }

    /* Fine noise/texture vignette */
    .vignette {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      box-shadow: inset 0 0 18vw rgba(0, 0, 0, 0.85);
    }

    .content {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      max-width: 640px;
      width: 100%;
    }

    .logo-wrap {
      opacity: 0;
      transform: translateY(18px) scale(0.97);
      animation: reveal 1.4s cubic-bezier(0.16, 1, 0.3, 1) 0.2s forwards;
    }

    .logo-wrap img {
      width: min(78vw, 420px);
      height: auto;
      filter: drop-shadow(0 0 40px rgba(201, 161, 90, 0.12));
    }

    .divider {
      width: 0;
      height: 1px;
      margin: 28px auto 22px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
      animation: expand 1.2s ease-out 1.1s forwards;
    }

    @keyframes expand {
      to { width: 160px; }
    }

    .tagline {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-weight: 400;
      font-size: clamp(1.35rem, 4vw, 1.9rem);
      letter-spacing: 0.14em;
      color: var(--gold-soft);
      text-transform: uppercase;
      opacity: 0;
      animation: reveal 1.2s cubic-bezier(0.16, 1, 0.3, 1) 0.9s forwards;
    }

    .subtext {
      margin-top: 14px;
      font-weight: 300;
      font-size: 0.85rem;
      letter-spacing: 0.08em;
      color: rgba(247, 244, 238, 0.55);
      max-width: 420px;
      line-height: 1.7;
      opacity: 0;
      animation: reveal 1.2s cubic-bezier(0.16, 1, 0.3, 1) 1.2s forwards;
    }

    @keyframes reveal {
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* Countdown */
    .countdown {
      display: flex;
      gap: clamp(10px, 3vw, 26px);
      margin-top: 46px;
      opacity: 0;
      animation: reveal 1.3s cubic-bezier(0.16, 1, 0.3, 1) 1.5s forwards;
    }

    .countdown .unit {
      display: flex;
      flex-direction: column;
      align-items: center;
      min-width: 64px;
      padding: 14px 6px 12px;
      border: 1px solid rgba(201, 161, 90, 0.25);
      border-radius: 4px;
      background: linear-gradient(180deg, rgba(201, 161, 90, 0.05), rgba(255, 255, 255, 0.01));
      backdrop-filter: blur(6px);
      transition: border-color 0.4s ease, box-shadow 0.4s ease;
    }

    .countdown .unit:hover {
      border-color: rgba(201, 161, 90, 0.55);
      box-shadow: 0 0 24px rgba(201, 161, 90, 0.12);
    }

    .countdown .value {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 500;
      font-size: clamp(1.8rem, 5vw, 2.6rem);
      color: var(--white);
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }

    .countdown .label {
      margin-top: 8px;
      font-size: 0.62rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: rgba(201, 161, 90, 0.75);
    }

    .countdown .sep {
      align-self: center;
      color: rgba(201, 161, 90, 0.3);
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.6rem;
      margin-top: -6px;
    }

    .date-note {
      margin-top: 26px;
      font-size: 0.72rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(247, 244, 238, 0.4);
      opacity: 0;
      animation: reveal 1.2s cubic-bezier(0.16, 1, 0.3, 1) 1.8s forwards;
    }

    footer {
      position: relative;
      z-index: 1;
      margin-top: 56px;
      font-size: 0.68rem;
      letter-spacing: 0.14em;
      color: rgba(247, 244, 238, 0.28);
      opacity: 0;
      animation: reveal 1.2s ease 2.1s forwards;
    }

    @media (max-width: 420px) {
      .countdown { gap: 8px; }
      .countdown .unit { min-width: 54px; padding: 10px 4px; }
      .countdown .sep { font-size: 1.2rem; }
    }
  </style>
</head>
<body>
  <div class="glow"></div>
  <div class="vignette"></div>

  <main class="content">
    <div class="logo-wrap">
      <img src="assets/imgs/KLASME-GROUP-LOGO.png" alt="Klasme Group">
    </div>

    <div class="divider"></div>

    <p class="tagline">Em breve</p>
    <p class="subtext">
      Uma nova era da beleza asiática está chegando ao Brasil.
      Grandes marcas, uma só assinatura de excelência.
    </p>

    <div class="countdown" id="countdown" aria-label="Contagem regressiva para o lançamento">
      <div class="unit"><span class="value" id="cd-days">00</span><span class="label">Dias</span></div>
      <span class="sep">:</span>
      <div class="unit"><span class="value" id="cd-hours">00</span><span class="label">Horas</span></div>
      <span class="sep">:</span>
      <div class="unit"><span class="value" id="cd-minutes">00</span><span class="label">Min</span></div>
      <span class="sep">:</span>
      <div class="unit"><span class="value" id="cd-seconds">00</span><span class="label">Seg</span></div>
    </div>

    <p class="date-note">Lançamento em 03 de setembro</p>
  </main>

  <footer>&copy; <span id="year"></span> Klasme Group. Todos os direitos reservados.</footer>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();

    var targetDate = new Date('2026-09-03T00:00:00-03:00').getTime();

    var els = {
      days: document.getElementById('cd-days'),
      hours: document.getElementById('cd-hours'),
      minutes: document.getElementById('cd-minutes'),
      seconds: document.getElementById('cd-seconds')
    };

    function pad(n) {
      return String(n).padStart(2, '0');
    }

    function tick() {
      var now = Date.now();
      var diff = targetDate - now;

      if (diff <= 0) {
        els.days.textContent = '00';
        els.hours.textContent = '00';
        els.minutes.textContent = '00';
        els.seconds.textContent = '00';
        clearInterval(timer);
        return;
      }

      var days = Math.floor(diff / (1000 * 60 * 60 * 24));
      var hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
      var minutes = Math.floor((diff / (1000 * 60)) % 60);
      var seconds = Math.floor((diff / 1000) % 60);

      els.days.textContent = pad(days);
      els.hours.textContent = pad(hours);
      els.minutes.textContent = pad(minutes);
      els.seconds.textContent = pad(seconds);
    }

    tick();
    var timer = setInterval(tick, 1000);
  </script>
</body>
</html>
